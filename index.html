<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Encuentra especialistas, compara información y agenda atención médica con claridad."
    />
    <meta name="theme-color" content="#f4f5f3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("yektia-theme");
        } catch {
          // sin storage, queda el tema claro.
        }
        const theme = saved === "dark" || saved === "light" ? saved : "light";
        const color = theme === "dark" ? "#111315" : "#f4f5f3";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = color;
      })();
    </script>
    <title>Yektia</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
